<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookstore API</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f4f4f8;
        color: #222;
        display: flex;
        justify-content: center;
        padding: 48px 16px;
      }

      main {
        background-color: #fff;
        padding: 32px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        max-width: 560px;
      }

      h1 {
        color: #1d3557;
      }

      .commit {
        background-color: #e8f0f8;
        padding: 12px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bookstore API</h1>
      <p>Hello World! O deploy automático está funcionando.</p>

      {% if commit %}
        <p class="commit">
          Último commit publicado: <strong>{{ commit.sha }}</strong><br />
          {{ commit.message }}
        </p>
      {% endif %}

      <ul>
        <li><a href="/api/product/">Produtos</a></li>
        <li><a href="/api/category/">Categorias</a></li>
      </ul>
    </main>
  </body>
</html>
