name: Code review automatico

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Revisao automatica
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o codigo
        uses: actions/checkout@v4

      - name: Configura o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instala o Ruff
        run: pip install ruff

      - name: Analisa o codigo
        # Os apontamentos aparecem como anotacoes na aba "Files changed".
        # continue-on-error: a revisao automatica orienta, mas nao bloqueia o Pull Request.
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Comenta no Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const marker = '<!-- code-review-automatico -->';
            const body = [
              marker,
              '### Revisão automática de código',
              '',
              'O Ruff analisou o código deste Pull Request. Confira os apontamentos, se houver, nas anotações da aba **Files changed**.',
              '',
              `Detalhes da execução: ${runUrl}`,
              '',
              '**Checklist de revisão**',
              '- [ ] Os testes do workflow **CI** passaram',
              '- [ ] O build do Docker passou',
              '- [ ] Os nomes de variáveis e funções estão claros',
              '- [ ] Não há senhas ou dados sensíveis no código',
              '- [ ] A descrição do Pull Request explica a mudança',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
