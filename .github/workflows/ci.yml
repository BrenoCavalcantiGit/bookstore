name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o codigo
        uses: actions/checkout@v4

      - name: Configura o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instala o Poetry
        run: pip install poetry

      - name: Instala as dependencias
        run: poetry install --no-interaction

      - name: Verifica o projeto
        run: poetry run python manage.py check

      - name: Roda os testes
        run: poetry run python manage.py test

  docker:
    name: Build do Docker
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o codigo
        uses: actions/checkout@v4

      - name: Valida o docker-compose
        run: docker compose config -q

      - name: Constroi a imagem
        run: docker build -t bookstore:ci .
