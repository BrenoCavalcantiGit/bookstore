services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d bookstore"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bookstore_network

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      SQL_ENGINE: django.db.backends.postgresql
      SQL_DATABASE: bookstore
      SQL_USER: bookstore
      SQL_PASSWORD: bookstore
      SQL_HOST: db
      SQL_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bookstore_network

volumes:
  postgres_data:

networks:
  bookstore_network:
    name: bookstore_network
    driver: bridge
