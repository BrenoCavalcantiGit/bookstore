[project]
name = "bookstore"
version = "0.1.0"
description = "Bookstore com Django"
authors = [
    {name = "Breno Cavalcanti",email = "brenopcavalcanti@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.1.3,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
